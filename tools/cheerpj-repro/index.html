<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>CheerpJ 5.0 Java 25 JIT reproducer</title>
<script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>
<h1>Standalone Java JIT reproducer</h1>
<p>Java source + java.base only. Each link starts a new VM.</p>
<p><a href="?">239 assignments (failure)</a> · <a href="?count=238">238 assignments (control)</a> · <a href="?loop=1">239 assignments in a loop (control)</a> · <a href="?debug=1">Failure with debug logs</a></p>
<p><a href="Repro.java">Java source</a> · <a href="ISSUE.md">Issue draft</a> · <a href="README.md">Build instructions</a></p>
<pre id="result">Initializing CheerpJ 5.0 / Java 25…</pre>
<script type="module">
  const output = document.getElementById('result');
  const params = new URLSearchParams(location.search);
  window.reproDone = false;
  let Probe;
  const started = performance.now();
  try {
    await cheerpjInit({version:25, status:'none', enableDebug:params.has('debug')});
    const directory = new URL('.', location.href).pathname;
    const jar = params.get('count') === '238' ? 'repro-238.jar' : 'repro.jar';
    const classpath = `/app${directory}${jar}`;
    output.textContent = 'Loading Java classes…';
    const lib = await cheerpjRunLibrary(classpath);
    Probe = await lib.Repro;
    output.textContent = 'Running 200 calls…';
    window.reproResult = await Probe.run(params.has('loop'));
    output.textContent = window.reproResult;
  } catch (error) {
    if (Probe && !(error instanceof Error)) {
      const completed = await Probe.completed;
      window.reproResult = `FAIL: ${completed} calls completed\n${await Probe.describe(error)}`;
    } else window.reproResult = error instanceof Error ? error.stack : await error.toString();
    output.textContent = window.reproResult;
  } finally {
    window.reproDone = true;
    window.elapsedMs = performance.now() - started;
  }
</script>
</html>
